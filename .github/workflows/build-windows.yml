name: Transparent AyuGram - Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transparent-ayugram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight - patch pinned AyuGram sources
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out patch
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download only patched source files and validate all anchors
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ayugram-patch-preflight'
          $ayuBase = 'https://raw.githubusercontent.com/AyuGram/AyuGramDesktop/v7.2.9/'
          $uiBase = 'https://raw.githubusercontent.com/AyuGram/lib_ui/e3d058223aea0b68938a07a7d436d67aaf2b1b30/'
          $sources = @(
            @{ base = $ayuBase; path = 'Telegram/SourceFiles/window/main_window.cpp' },
            @{ base = $ayuBase; path = 'Telegram/SourceFiles/mainwindow.cpp' },
            @{ base = $ayuBase; path = 'Telegram/SourceFiles/window/section_widget.cpp' },
            @{ base = $ayuBase; path = 'Telegram/SourceFiles/window/window_main_menu.cpp' },
            @{ base = $uiBase; path = 'Telegram/lib_ui/ui/colors.palette'; source = 'ui/colors.palette' },
            @{ base = $uiBase; path = 'Telegram/lib_ui/ui/style/style_core_palette.h'; source = 'ui/style/style_core_palette.h' },
            @{ base = $uiBase; path = 'Telegram/lib_ui/ui/style/style_core_palette.cpp'; source = 'ui/style/style_core_palette.cpp' },
            @{ base = $uiBase; path = 'Telegram/lib_ui/ui/widgets/scroll_area.cpp'; source = 'ui/widgets/scroll_area.cpp' }
          )
          foreach ($file in $sources) {
            $target = Join-Path $root $file.path
            New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
            $source = if ($file.source) { $file.source } else { $file.path }
            Invoke-WebRequest -Uri ($file.base + $source) -OutFile $target -TimeoutSec 60 -ErrorAction Stop
          }
          python -m py_compile scripts/apply_transparency.py
          if ($LASTEXITCODE -ne 0) { throw 'Transparency patch has invalid Python syntax.' }
          python scripts/apply_transparency.py --ayugram $root
          if ($LASTEXITCODE -ne 0) { throw 'Pinned AyuGram patch preflight failed. Expensive Windows compilation was not started.' }
          Write-Host 'Pinned AyuGram source patches verified; the full build may proceed.'

  windows-x64:
    name: AyuGram Desktop 7.2.9 (Windows x64 / Qt5)
    runs-on: windows-2022
    timeout-minutes: 360
    needs: preflight
    defaults:
      run:
        shell: pwsh
    env:
      AYUGRAM_TAG: v7.2.9
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

    steps:
      - name: Assert Windows runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'This workflow requires a Windows runner.' }
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH"

      - name: Require production Telegram API credentials
        run: |
          if (!$env:TDESKTOP_API_ID -or !$env:TDESKTOP_API_HASH) {
            throw 'Missing TDESKTOP_API_ID or TDESKTOP_API_HASH Actions secret. Stopping before dependency compilation.'
          }
          Write-Host 'Both Telegram API credentials are configured.'

      - name: Check out transparency patch
        uses: actions/checkout@v4

      - name: Python 3.10 (upstream requirement)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone AyuGram Desktop and required submodules
        run: |
          git config --global core.longpaths true
          $tbuild = Join-Path $env:USERPROFILE 'TBuild'
          New-Item -ItemType Directory -Force (Join-Path $tbuild 'ThirdParty') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $tbuild 'Libraries') | Out-Null
          "TBUILD=$tbuild" >> $env:GITHUB_ENV
          "LibrariesPath=$(Join-Path $tbuild 'Libraries\win64')" >> $env:GITHUB_ENV
          $src = Join-Path $tbuild 'tdesktop'
          git -c core.longpaths=true clone --depth 1 --branch $env:AYUGRAM_TAG https://github.com/AyuGram/AyuGramDesktop.git $src
          if ($LASTEXITCODE -ne 0) { throw 'AyuGram source clone failed.' }
          Push-Location $src
          try {
            git -c core.longpaths=true submodule update --init --depth 1
            if ($LASTEXITCODE -ne 0) { throw 'AyuGram submodule initialization failed.' }
          } finally { Pop-Location }

      - name: Apply transparency modifications
        run: |
          python -m py_compile scripts/apply_transparency.py
          if ($LASTEXITCODE -ne 0) { throw 'Patch script syntax error.' }
          python scripts/apply_transparency.py --ayugram (Join-Path $env:TBUILD 'tdesktop')
          if ($LASTEXITCODE -ne 0) { throw 'Transparency patch failed – upstream source changed.' }

      - name: Enable MSVC x64 environment
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: '10.0.26100.0'
          toolset: '14.44'

      - name: Verify Visual C++ ATL/MFC headers
        run: |
          $header = Join-Path $env:VCToolsInstallDir 'atlmfc\include\atlbase.h'
          if (!(Test-Path $header)) { throw ('MSVC ATL headers missing at ' + $header) }
          Write-Host 'ATL headers verified.'

      - name: Restore third-party sources cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-ayugram-thirdparty-v7.2.9-v1

      - name: Restore compiled third-party libraries cache
        id: compiled-libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-ayugram-libs-v7.2.9-v1

      - name: Restore built Qt cache
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LibrariesPath }}\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ runner.arch }}-ayugram-qt6-v7.2.9-v1

      - name: Prepare AyuGram libraries (Qt5)
        run: |
          # AyuGram v7.2.9 requests a MINGW64 diffutils package removed
          # from MSYS2's repositories. The MSYS diffutils package supplies
          # the required diff/cmp utilities on PATH.
          $prepare = Join-Path $env:TBUILD 'tdesktop\Telegram\build\prepare\prepare.py'
          $source = [System.IO.File]::ReadAllText($prepare)
          $oldPackage = 'mingw-w64-x86_64-diffutils ^'
          if ($source.Split(@($oldPackage), [System.StringSplitOptions]::None).Length -ne 2) {
            throw 'AyuGram MSYS2 dependency patch anchor did not match exactly once.'
          }
          $source = $source.Replace($oldPackage, 'diffutils ^')
          [System.IO.File]::WriteAllText($prepare, $source, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'Replaced obsolete MINGW64 diffutils dependency with MSYS diffutils.'
          & (Join-Path $env:TBUILD 'tdesktop\Telegram\build\prepare\win.bat') silent
          if ($LASTEXITCODE -ne 0) { throw 'AyuGram Windows dependency build failed.' }

      # Explicit saves are run before application compilation so a failed
      # AyuGram C++ build does not discard expensive dependency/Qt builds.
      - name: Save prepared third-party sources cache
        continue-on-error: true
        if: steps.third-party-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.third-party-cache.outputs.cache-primary-key }}

      - name: Save prepared compiled libraries cache
        continue-on-error: true
        if: steps.compiled-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
          key: ${{ steps.compiled-libs-cache.outputs.cache-primary-key }}

      - name: Save prepared Qt cache
        continue-on-error: true
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LibrariesPath }}\[qQ]t[_-]*
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Configure and build Release
        run: |
          $apiArguments = @('-D', "TDESKTOP_API_ID=$env:TDESKTOP_API_ID", '-D', "TDESKTOP_API_HASH=$env:TDESKTOP_API_HASH")
          "API_MODE=production" >> $env:GITHUB_ENV
          Write-Host 'Using repository Telegram API secrets (production API).'
          Push-Location (Join-Path $env:TBUILD 'tdesktop\Telegram')
          try {
            # Pinned cmake_helpers enables bare /MP. It can spawn many cl.exe
            # processes even when CMake --parallel is low, causing MSVC C1060
            # on standard GitHub-hosted Windows runners.
            $optionsPath = Join-Path $env:TBUILD 'tdesktop\cmake\options_win.cmake'
            $options = [System.IO.File]::ReadAllText($optionsPath)
            $oldFlag = '/MP     # Enable multi process build.'
            if ($options.Split(@($oldFlag), [System.StringSplitOptions]::None).Length -ne 2) {
              throw 'Cannot disable upstream MSVC /MP: compiler options changed.'
            }
            $options = $options.Replace($oldFlag, '# /MP disabled: avoid MSVC C1060 on hosted Windows runners.')
            [System.IO.File]::WriteAllText($optionsPath, $options, [System.Text.UTF8Encoding]::new($false))
            $env:CL_MPCount = '1'
            Write-Host 'Memory-safe mode: MSVC /MP disabled, one MSBuild worker.'
            $ramGiB = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
            Write-Host "Installed RAM: $ramGiB GiB."
            & .\configure.bat x64 @apiArguments '-D' 'CMAKE_CONFIGURATION_TYPES=Release' '-D' 'CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=' '-D' 'DESKTOP_APP_DISABLE_AUTOUPDATE=ON' '-D' 'DESKTOP_APP_DISABLE_CRASH_REPORTS=ON'
            if ($LASTEXITCODE -ne 0) { throw 'AyuGram CMake configuration failed.' }
            cmake --build ..\out --config Release --target Telegram --parallel 1 -- /m:1 /nodeReuse:false
            if ($LASTEXITCODE -ne 0) { throw 'AyuGram build failed.' }
          } finally {
            Pop-Location
          }

      - name: Verify and stage executable
        run: |
          $exe = Join-Path $env:TBUILD 'tdesktop\out\Release\AyuGram.exe'
          if (!(Test-Path $exe)) { throw 'AyuGram.exe not found; no artifact will be published.' }
          New-Item -ItemType Directory -Force 'artifact' | Out-Null
          Copy-Item $exe 'artifact\AyuGram.exe'
          "Upstream: AyuGram Desktop $env:AYUGRAM_TAG" | Set-Content 'artifact\BUILD-INFO.txt'
          "API mode: $env:API_MODE" | Add-Content 'artifact\BUILD-INFO.txt'
          "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH" | Add-Content 'artifact\BUILD-INFO.txt'
          Get-FileHash 'artifact\AyuGram.exe' -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  AyuGram.exe" | Set-Content 'artifact\SHA256SUMS.txt'
          }

      - name: Upload portable Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: transparent-ayugram-windows-x64-${{ env.API_MODE }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
